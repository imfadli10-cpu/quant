name: Jaga repo tetap aktif (bulanan)

# Repo PUBLIK: GitHub mematikan jadwal otomatis setelah 60 hari tanpa aktivitas repo.
# Workflow ini membuat satu commit kecil tiap bulan supaya collector & paper trading tidak berhenti diam-diam.
# Dibuat atas izin pengguna (20 Nov 2026). Hanya mengubah file .github/aktif.txt.
on:
  schedule:
    - cron: "7 6 1 * *"       # tanggal 1 tiap bulan, 13:07 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Catat tanggal & commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/aktif.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/aktif.txt
          git commit -m "Jaga repo tetap aktif (otomatis bulanan)" || echo "tidak ada perubahan"
          git push
