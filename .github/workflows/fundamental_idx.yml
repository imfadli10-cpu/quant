name: Foto fundamental IDX (mingguan)

on:
  schedule:
    - cron: "47 2 * * 6"    # setiap Sabtu jam 09:47 WIB (02:47 UTC), bursa tutup
  workflow_dispatch:         # tombol untuk menjalankan manual

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # banyak collector mingguan (fundamental, aksi, SEKI, Pink Sheet, BIS, laba, saham beredar, ALFRED, OJK)
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Foto fundamental semua saham IDX (Yahoo)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_fundamental_idx.py   # gagal (< 700 saham) = email alarm

      - name: Aksi korporasi IDX (dividen & split, seluruh histori)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # daftar_saham.kode_idx() mengunduh daftar tambahan dari gudang
        run: python kumpul_aksi_idx.py   # gagal (< 500 kode) = langkah merah, foto fundamental tetap diupload

      - name: SEKI Bank Indonesia (~108 tabel; simpan yang berubah saja, upload sendiri)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_seki.py

      - name: World Bank Pink Sheet (71 komoditas bulanan sejak 1960; upload sendiri)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_pinksheet.py

      - name: BIS (likuiditas global, celah kredit, suku bunga kebijakan, kurs efektif...; semua negara)
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # upload_satu.py butuh kunci (pelajaran 21 Nov 2026)
        run: python kumpul_bis.py && python upload_satu.py data/raw/bis
        timeout-minutes: 40

      - name: Pengumuman laba IDX (EPS aktual vs perkiraan, Yahoo; upload sendiri)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python kumpul_laba_idx.py

      - name: Histori jumlah saham beredar IDX (Yahoo get_shares_full; gabung dgn file lama, upload sendiri)
        continue-on-error: true
        timeout-minutes: 45
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # kode_idx() + membaca file lama dari gudang
          PYTHONUNBUFFERED: "1"
        run: python kumpul_saham_beredar.py && python upload_satu.py data/raw/saham_beredar

      - name: ALFRED (vintage FRED = angka makro point-in-time + jadwal rilis; upload sendiri)
        continue-on-error: true
        timeout-minutes: 40
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python kumpul_alfred.py && python upload_satu.py data/raw/alfred

      - name: OJK ikhtisar emisi efek & aksi korporasi mingguan (hanya file baru; upload sendiri)
        continue-on-error: true
        timeout-minutes: 60
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # daftar file yang sudah ada di gudang
          PYTHONUNBUFFERED: "1"
        run: python kumpul_ojk_emisi.py && if [ -d data/raw/ojk_emisi ]; then python upload_satu.py data/raw/ojk_emisi; fi

      - name: Upload ke Hugging Face (hanya folder ini, file lama tidak dihapus)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python upload_satu.py data/raw/fundamental_idx

      - name: Upload aksi korporasi
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: if [ -d data/raw/aksi_idx ]; then python upload_satu.py data/raw/aksi_idx; fi

      - name: Perbarui katalog
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python buat_katalog.py
