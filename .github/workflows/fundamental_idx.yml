name: Foto fundamental IDX (mingguan)

on:
  schedule:
    - cron: "47 2 * * 6"    # setiap Sabtu jam 09:47 WIB (02:47 UTC), bursa tutup
  workflow_dispatch:         # tombol untuk menjalankan manual

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Foto fundamental semua saham IDX (Yahoo)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_fundamental_idx.py   # gagal (< 700 saham) = email alarm

      - name: Aksi korporasi IDX (dividen & split, seluruh histori)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # daftar_saham.kode_idx() mengunduh daftar tambahan dari gudang
        run: python kumpul_aksi_idx.py   # gagal (< 500 kode) = langkah merah, foto fundamental tetap diupload

      - name: SEKI Bank Indonesia (~108 tabel; simpan yang berubah saja, upload sendiri)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_seki.py

      - name: World Bank Pink Sheet (71 komoditas bulanan sejak 1960; upload sendiri)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_pinksheet.py

      - name: Upload ke Hugging Face (hanya folder ini, file lama tidak dihapus)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python upload_satu.py data/raw/fundamental_idx

      - name: Upload aksi korporasi
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: if [ -d data/raw/aksi_idx ]; then python upload_satu.py data/raw/aksi_idx; fi

      - name: Perbarui katalog
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python buat_katalog.py
