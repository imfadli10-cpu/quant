name: Kumpulkan data harian

on:
  schedule:
    - cron: "17 23 * * *"   # setiap hari jam 06:17 WIB (23:17 UTC)
  workflow_dispatch:         # tombol untuk menjalankan manual

jobs:
  kumpulkan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Ambil data makro (FRED)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python ambil_makro.py

      - name: Upload ke Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python upload_ke_cloud.py