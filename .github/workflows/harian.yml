name: Kumpulkan data harian

on:
  schedule:
    - cron: "17 0 * * *"    # setiap hari jam 07:17 WIB (00:17 UTC)
  workflow_dispatch:         # tombol untuk menjalankan manual

jobs:
  kumpulkan:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # job ~76 mnt (22 Nov 2026); batas lama 90 terlalu mepet -> upload di akhir bisa terpotong
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Ambil data makro (FRED)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python ambil_makro.py

      - name: Foto daftar saham IDX (Yahoo) + tambah kode IPO baru (harus SEBELUM harga harian)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_daftar_idx.py

      - name: Ambil harga harian (IDX + global)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_harga_harian.py

      - name: Ambil saham AS (semua)
        continue-on-error: true
        run: python kumpul_saham_as.py

      - name: Ambil cuaca harian (15 kota)
        continue-on-error: true
        run: python kumpul_cuaca_harian.py

      - name: Ambil data BigQuery (Bitcoin, Ethereum, GDELT, Trends)
        continue-on-error: true
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_KEY_JSON }}
        run: python kumpul_bigquery.py

      - name: Ambil Wikipedia pageviews
        continue-on-error: true
        run: python kumpul_wikipedia.py
      - name: Ambil crypto (Coinbase)
        continue-on-error: true
        run: python kumpul_crypto.py

      - name: Ambil data alam (gempa + matahari)
        continue-on-error: true
        run: python kumpul_alam.py

      - name: Ambil data riset (CFTC COT + Fama-French)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_riset.py
      - name: Ambil data opsi saham AS
        continue-on-error: true
        run: python kumpul_opsi.py

      - name: Ambil volume short harian AS (FINRA)
        continue-on-error: true
        run: python kumpul_finra.py

      - name: Ambil harga & stok logam LME (Westmetall)
        continue-on-error: true
        run: python kumpul_lme.py

      - name: Ambil kurs resmi ECB (~40 mata uang termasuk rupiah)
        continue-on-error: true
        run: python kumpul_kurs_ecb.py

      - name: Foto pasar prediksi Polymarket (~3.500 pasar)
        continue-on-error: true
        run: python kumpul_polymarket.py

      - name: Foto pasar prediksi Kalshi (~85 ribu pasar non-olahraga)
        continue-on-error: true
        run: python kumpul_kalshi.py

      - name: Yield SBN & obligasi korporasi Indonesia (PHEI)
        continue-on-error: true
        run: python kumpul_sbn.py

      - name: Titik api kebakaran Indonesia & sekitarnya (NASA FIRMS)
        continue-on-error: true
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python kumpul_api.py

      - name: Hasil lelang SUN & SBSN (DJPPR, dari beranda)
        continue-on-error: true
        run: python kumpul_lelang_sbn.py

      - name: Hasil operasi moneter BI (SRBI, SUVBI, TD, repo, FX swap, DNDF jual = intervensi kurs)
        continue-on-error: true
        timeout-minutes: 15
        run: python kumpul_operasi_moneter.py

      - name: IndONIA (suku bunga antarbank semalam) + kurva pasar uang repo/SRBI (Bank Indonesia)
        continue-on-error: true
        timeout-minutes: 10
        run: python kumpul_indonia.py

      - name: Kepemilikan SBN per jenis investor termasuk ASING (DJPPR; hanya file baru, langsung ke gudang)
        continue-on-error: true
        timeout-minutes: 15
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # membaca indeks & harian lama + upload arsip
        run: python kumpul_kepemilikan_sbn.py

      - name: Aktivitas pelabuhan & jalur kapal dunia (IMF PortWatch)
        continue-on-error: true
        run: python kumpul_pelabuhan.py

      - name: IPO saham Indonesia (e-IPO; daftar + detail IPO yang masih berjalan)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}     # membaca detail.parquet lama dari gudang
        run: python kumpul_ipo.py

      - name: Berita emiten IDX (sitemap EmitenNews, ~2.000 artikel terbaru)
        continue-on-error: true
        run: python kumpul_emitennews.py

      - name: Perhatian publik per saham IDX (pembaca Wikipedia ~280 perusahaan)
        continue-on-error: true
        timeout-minutes: 45   # biasanya ~35 mnt (Wikimedia membatasi kecepatan, 429); jangan sampai menghabiskan batas job
        run: python kumpul_perhatian_idx.py

      - name: Harga intraday 1 menit saham & ETF IDX (3 hari bursa terakhir)
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_intraday_idx.py

      - name: Indeks iklim global (El Nino/La Nina, SOI, MEI, IOD, Nino mingguan)
        continue-on-error: true
        run: python kumpul_iklim.py

      - name: Kualitas udara per jam 12 kota (polusi & asap kebakaran)
        continue-on-error: true
        run: python kumpul_udara.py

      - name: Harga pangan harian (PIHPS BI, nasional & 34 provinsi)
        continue-on-error: true
        run: python kumpul_pangan.py

      - name: Kurs JISDOR Bank Indonesia (USD/IDR referensi resmi, ~10:00 WIB)
        continue-on-error: true
        run: python kumpul_jisdor.py

      - name: Hasil lelang surat utang pemerintah AS (fiscaldata)
        continue-on-error: true
        run: python kumpul_lelang_as.py

      - name: Arus kas harian pemerintah AS (Daily Treasury Statement, 9 tabel sejak 2005)
        continue-on-error: true
        run: python kumpul_dts.py

      - name: Indeks volatilitas & sentimen opsi CBOE (32 indeks, termasuk VXEEM pasar berkembang)
        continue-on-error: true
        run: python kumpul_cboe.py

      - name: Put/call & volume opsi CBOE harian (per produk; menyambung arsip 2019)
        continue-on-error: true
        run: python kumpul_putcall.py

      - name: Upload ke Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python upload_ke_cloud.py

      - name: Perbarui katalog
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python buat_katalog.py

      - name: Validasi data
        run: python validasi_harian.py