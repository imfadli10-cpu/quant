name: Isi histori SHFE (harga 2002+ & stok mingguan)

on:
  workflow_dispatch:         # manual, sekali jalan (bisa diulang: tahun yang sudah ada di gudang dilewati, kecuali tahun berjalan)

jobs:
  isi:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Isi histori SHFE (upload tiap tahun)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_shfe.py --histori
