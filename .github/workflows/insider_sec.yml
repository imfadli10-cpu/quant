name: Transaksi orang dalam SEC (bulanan)

on:
  schedule:
    - cron: "29 3 3 * *"    # tanggal 3 setiap bulan, 10:29 WIB (SEC merilis data kuartal baru beberapa minggu setelah kuartal usai)
  workflow_dispatch:         # jalankan manual sekali untuk mengisi histori sejak 2006 (~30 menit, bisa diulang)

jobs:
  insider:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Ambil transaksi orang dalam (kuartal baru + 2 terbaru; upload tiap kuartal)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python kumpul_insider_sec.py

      - name: Perbarui katalog
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python buat_katalog.py
