name: Isi histori titik api (NASA FIRMS)

on:
  workflow_dispatch:         # manual, sekali jalan (bisa diulang: tahun yang sudah ada di gudang dilewati)

jobs:
  isi:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install library
        run: pip install -r requirements.txt

      - name: Isi histori titik api (MODIS sejak 2000-11, VIIRS sejak 2012; upload tiap tahun)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python kumpul_api.py --histori
